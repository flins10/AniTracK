name: Build Tauri v2 Native Apps (Android, Windows, macOS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (leave blank to auto-generate)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag and create GitHub Release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version || '1.0.0'")
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${VERSION}-tauri-${{ github.run_number }}"
          fi
          RELEASE_NAME="Anime Universe ${TAG}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$RELEASE_NAME" \
              --notes "Native Tauri v2 installers for **ANIME UNIVERSE** loading https://animeuniverse.pages.dev directly (auto-updates on every Cloudflare deployment)."
          fi

  build-desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI dependencies
        run: npm install

      - name: Ensure Tauri v2 project and icons are initialized
        shell: bash
        run: |
          if [ ! -f "src-tauri/Cargo.toml" ]; then
            cp src-tauri/tauri.conf.json /tmp/tauri.conf.json.bak || true
            npx tauri init --ci \
              --app-name "Anime Universe" \
              --window-title "ANIME UNIVERSE" \
              --frontend-dist "https://animeuniverse.pages.dev" \
              --dev-url "https://animeuniverse.pages.dev" || true
            if [ -f /tmp/tauri.conf.json.bak ]; then
              cp /tmp/tauri.conf.json.bak src-tauri/tauri.conf.json
            fi
          fi
          if [ ! -f "src-tauri/icons/icon.png" ] && [ -f "public/icon-512.png" ]; then
            mkdir -p src-tauri/icons
            cp public/icon-512.png src-tauri/icons/icon.png
          fi
          npx tauri icon src-tauri/icons/icon.png

      - name: Build and attach desktop installers (.exe / .msi / .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: ${{ needs.prepare-release.outputs.release_name }}
          releaseBody: 'Native Tauri v2 installers for **ANIME UNIVERSE** loading https://animeuniverse.pages.dev directly.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config '{"bundle":{"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico","icons/icon.png"]}}'

  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK, NDK, Build Tools 36.0.0 & local.properties
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_ROOT}/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-arm-dbt-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_ROOT}/licenses/android-googletv-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "${SDK_ROOT}/licenses/google-gdk-license"

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            $(ls -1d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1) \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_DIR="${SDK_ROOT}/ndk/27.2.12479018"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\nndk.dir=%s\n" "${SDK_ROOT}" "${NDK_DIR}" > local.properties

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI dependencies
        run: npm install

      - name: Initialize Tauri v2 & Android project and generate icons
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "src-tauri/Cargo.toml" ]; then
            cp src-tauri/tauri.conf.json /tmp/tauri.conf.json.bak || true
            npx tauri init --ci \
              --app-name "Anime Universe" \
              --window-title "ANIME UNIVERSE" \
              --frontend-dist "https://animeuniverse.pages.dev" \
              --dev-url "https://animeuniverse.pages.dev" || true
            if [ -f /tmp/tauri.conf.json.bak ]; then
              cp /tmp/tauri.conf.json.bak src-tauri/tauri.conf.json
            fi
          fi
          if [ ! -f "src-tauri/icons/icon.png" ] && [ -f "public/icon-512.png" ]; then
            mkdir -p src-tauri/icons
            cp public/icon-512.png src-tauri/icons/icon.png
          fi
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR="${NDK_HOME:-${SDK_ROOT}/ndk/27.2.12479018}"
          printf "sdk.dir=%s\nndk.dir=%s\n" "${SDK_ROOT}" "${NDK_DIR}" > local.properties
          if [ -d "src-tauri/gen/android" ]; then
            printf "sdk.dir=%s\nndk.dir=%s\n" "${SDK_ROOT}" "${NDK_DIR}" > src-tauri/gen/android/local.properties
          fi
          if [ -f "src-tauri/gen/android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 36\n    buildToolsVersion = "36.0.0"/' src-tauri/gen/android/app/build.gradle.kts || true
            if ! grep -q "work-runtime-ktx" src-tauri/gen/android/app/build.gradle.kts; then
              printf '\ndependencies {\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n}\n' >> src-tauri/gen/android/app/build.gradle.kts
            fi
          fi
          if [ -f "src-tauri/gen/android/app/proguard-rules.pro" ]; then
            if ! grep -q "com.animeuniverse.app" src-tauri/gen/android/app/proguard-rules.pro; then
              cat << 'EOF' >> src-tauri/gen/android/app/proguard-rules.pro
-keep class app.tauri.** { *; }
-keep class com.animeuniverse.app.** { *; }
-keep class androidx.work.** { *; }
-keep class com.google.firebase.messaging.** { *; }
-keepclassmembers class * {
    @android.webkit.JavascriptInterface <methods>;
}
EOF
            fi
          fi
          mkdir -p src-tauri/gen/android/app/src/main/res/drawable
          if [ -f "src-tauri/android-bg/ic_stat_anime_notification.xml" ]; then
            cp src-tauri/android-bg/ic_stat_anime_notification.xml src-tauri/gen/android/app/src/main/res/drawable/ic_stat_anime_notification.xml
          fi
          ANDROID_PKG_DIR="src-tauri/gen/android/app/src/main/java/com/animeuniverse/app"
          if [ -d "${ANDROID_PKG_DIR}" ] && [ -f "src-tauri/android-bg/AnimeNotifWorker.kt" ]; then
            cp src-tauri/android-bg/AnimeNotifWorker.kt "${ANDROID_PKG_DIR}/AnimeNotifWorker.kt"
            cp src-tauri/android-bg/MainActivity.kt "${ANDROID_PKG_DIR}/MainActivity.kt"
          fi
          HAS_FCM=0
          if [ -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
            printf "%s" "${FIREBASE_GOOGLE_SERVICES_JSON}" > src-tauri/gen/android/app/google-services.json
            HAS_FCM=1
          elif [ -f "src-tauri/android-bg/google-services.json" ]; then
            cp src-tauri/android-bg/google-services.json src-tauri/gen/android/app/google-services.json
            HAS_FCM=1
          fi
          if [ "${HAS_FCM}" = "1" ] && [ -d "${ANDROID_PKG_DIR}" ] && [ -f "src-tauri/android-bg/AnimeFirebaseMessagingService.kt" ]; then
            cp src-tauri/android-bg/AnimeFirebaseMessagingService.kt "${ANDROID_PKG_DIR}/AnimeFirebaseMessagingService.kt"
            if ! grep -q "com.google.gms.google-services" src-tauri/gen/android/build.gradle.kts; then
              sed -i 's/dependencies {/dependencies {\n        classpath("com.google.gms:google-services:4.4.2")/' src-tauri/gen/android/build.gradle.kts || true
            fi
            if ! grep -q "firebase-messaging" src-tauri/gen/android/app/build.gradle.kts; then
              printf '\napply(plugin = "com.google.gms.google-services")\ndependencies {\n    implementation("com.google.firebase:firebase-messaging-ktx:24.0.3")\n}\n' >> src-tauri/gen/android/app/build.gradle.kts
            fi
          fi
          ANDROID_MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "${ANDROID_MANIFEST}" ]; then
            HAS_FCM="${HAS_FCM}" python3 -c '
          import os
          from pathlib import Path
          p = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          for perm in [
              "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
              "<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />",
              "<uses-permission android:name=\"android.permission.VIBRATE\" />",
              "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
          ]:
              if perm not in txt:
                  txt = txt.replace("<application", f"    {perm}\n    <application", 1)
          meta_channel = (
              "        <meta-data\n"
              "            android:name=\"com.google.firebase.messaging.default_notification_channel_id\"\n"
              "            android:value=\"anime_community_alerts\" />"
          )
          if "com.google.firebase.messaging.default_notification_channel_id" not in txt:
              txt = txt.replace("</application>", f"{meta_channel}\n    </application>", 1)
          receiver = (
              "        <receiver\n"
              "            android:name=\".AnimeNotifBootReceiver\"\n"
              "            android:enabled=\"true\"\n"
              "            android:exported=\"false\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />\n"
              "                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />\n"
              "            </intent-filter>\n"
              "        </receiver>"
          )
          if "AnimeNotifBootReceiver" not in txt:
              txt = txt.replace("</application>", f"{receiver}\n    </application>", 1)
          if os.environ.get("HAS_FCM") == "1" and "AnimeFirebaseMessagingService" not in txt:
              fcm_svc = (
                  "        <service\n"
                  "            android:name=\".AnimeFirebaseMessagingService\"\n"
                  "            android:exported=\"false\">\n"
                  "            <intent-filter>\n"
                  "                <action android:name=\"com.google.firebase.MESSAGING_EVENT\" />\n"
                  "            </intent-filter>\n"
                  "        </service>"
              )
              txt = txt.replace("</application>", f"{fcm_svc}\n    </application>", 1)
          p.write_text(txt, encoding="utf-8")
          '
          fi
          npx tauri icon src-tauri/icons/icon.png

      - name: Build Android APK
        run: |
          npx tauri android build --apk --target aarch64

      - name: Sign & package installable Android APK
        run: |
          mkdir -p dist-android
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "No APK found in build outputs!"
            exit 1
          fi
          OUT_APK="dist-android/Anime-Universe-Android.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          fi

          if [[ "$RAW_APK" == *"-unsigned.apk" ]]; then
            keytool -genkeypair -v \
              -keystore /tmp/release-key.jks \
              -alias animeuniverse \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass animeuniverse123 -keypass animeuniverse123 \
              -dname "CN=Anime Universe, OU=App, O=Anime Universe, L=Cloud, S=Web, C=US"
            "${BUILD_TOOLS}/zipalign" -f -p 4 "$RAW_APK" /tmp/aligned.apk
            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/release-key.jks \
              --ks-key-alias animeuniverse \
              --ks-pass pass:animeuniverse123 \
              --key-pass pass:animeuniverse123 \
              --out "$OUT_APK" \
              /tmp/aligned.apk
          else
            cp "$RAW_APK" "$OUT_APK"
          fi
          ls -lh "$OUT_APK"

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: dist-android/Anime-Universe-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
