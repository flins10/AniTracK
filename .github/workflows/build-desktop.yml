name: Build PC Installers (EXE & DMG)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if ("$env:SUPABASE_URL" -ne "" -and "$env:SUPABASE_ANON_KEY" -ne "") {
            "SUPABASE_URL=$env:SUPABASE_URL" | Out-File -Encoding utf8 .env
            "SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" | Out-File -Encoding utf8 -Append .env
          } else {
            Copy-Item .env.example .env -ErrorAction SilentlyContinue
          }

      - name: Build Windows Executable / Installer (.exe)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :desktop:packageExe --stacktrace --no-daemon

      - name: Stage Windows .exe Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $exe = Get-ChildItem -Path desktop/build/compose/binaries -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "Could not find generated .exe installer"
            exit 1
          }
          Copy-Item $exe.FullName -Destination "dist-win/AnimeUniverse-Windows-Installer.exe" -Force

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-windows-installer
          path: dist-win/AnimeUniverse-Windows-Installer.exe
          if-no-files-found: error

      - name: Publish Windows .exe to GitHub Releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-exe-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $title = "Anime Universe Windows EXE Installer Build #$env:GITHUB_RUN_NUMBER"
          $notes = "Automatically generated Windows (.exe) desktop installer for Anime Universe."
          gh release create $tag "dist-win/AnimeUniverse-Windows-Installer.exe" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "$title" `
            --notes "$notes" `
            --target "$env:GITHUB_SHA"

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_ANON_KEY}" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build macOS Disk Image (.dmg)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :desktop:packageDmg --stacktrace --no-daemon

      - name: Stage macOS .dmg Installer
        shell: bash
        run: |
          set -e
          mkdir -p dist-mac
          DMG_FILE=$(find desktop/build/compose/binaries -name "*.dmg" | head -n 1)
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "ERROR: Could not find generated .dmg file"
            exit 1
          fi
          cp "${DMG_FILE}" dist-mac/AnimeUniverse-macOS-Installer.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-macos-dmg
          path: dist-mac/AnimeUniverse-macOS-Installer.dmg
          if-no-files-found: error

      - name: Publish macOS .dmg to GitHub Releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="macos-dmg-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Anime Universe macOS DMG Installer Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated macOS (.dmg) desktop installer for Anime Universe."
          gh release create "${RELEASE_TAG}" dist-mac/AnimeUniverse-macOS-Installer.dmg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}"
