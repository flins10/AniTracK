name: Build Desktop Installers (.exe & .dmg)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Windows .exe Installer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle packageExe --stacktrace --no-daemon

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraLog-Windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  build-macos-dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build macOS .dmg Installer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle packageDmg --stacktrace --no-daemon

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraLog-macOS-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  publish-desktop-release:
    needs: [build-windows-exe, build-macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows .exe Artifact
        uses: actions/download-artifact@v4
        with:
          name: AuraLog-Windows-exe
          path: dist/windows

      - name: Download macOS .dmg Artifact
        uses: actions/download-artifact@v4
        with:
          name: AuraLog-macOS-dmg
          path: dist/macos

      - name: Publish .exe and .dmg to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RELEASE_TAG="desktop-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Desktop Installers (.exe & .dmg) Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated Windows (.exe) and macOS (.dmg) desktop installers for AuraLog."

          gh release create "${RELEASE_TAG}" \
            dist/windows/*.exe \
            dist/macos/*.dmg \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest=false

          {
            echo "### Desktop Installers Ready (.exe & .dmg)"
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **Release Page:** https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- **Windows Installer:** \`AuraLog-2.1.0.exe\`"
            echo "- **macOS Installer:** \`AuraLog-2.1.0.dmg\`"
          } >> "${GITHUB_STEP_SUMMARY}"
