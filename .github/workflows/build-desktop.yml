name: Build PC Installers (EXE & DMG)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if ("$env:SUPABASE_URL" -ne "" -and "$env:SUPABASE_ANON_KEY" -ne "") {
            "SUPABASE_URL=$env:SUPABASE_URL" | Out-File -Encoding utf8 .env
            "SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" | Out-File -Encoding utf8 -Append .env
          } else {
            Copy-Item .env.example .env -ErrorAction SilentlyContinue
          }

      - name: Build Windows Executable / Installer (.exe)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :desktop:packageExe --stacktrace --no-daemon

      - name: Upload Windows EXE / MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-windows-installers
          path: desktop/build/compose/binaries/main/
          if-no-files-found: error

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_ANON_KEY}" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build macOS Disk Image (.dmg)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :desktop:packageDmg --stacktrace --no-daemon

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-macos-dmg
          path: desktop/build/compose/binaries/main/
          if-no-files-found: error
