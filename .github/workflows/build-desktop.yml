name: Build Desktop Installers (.exe & .dmg)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Windows .exe Installer
        working-directory: desktop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle packageExe --stacktrace --no-daemon

      - name: Stage Windows .exe Installer
        shell: bash
        run: |
          set -e
          mkdir -p dist-win
          EXE_FILE=$(find desktop/build/compose/binaries -name "*.exe" | head -n 1)
          if [ -z "${EXE_FILE}" ] || [ ! -f "${EXE_FILE}" ]; then
            echo "ERROR: Could not find generated .exe file"
            find desktop/build -maxdepth 5 || true
            exit 1
          fi
          cp "${EXE_FILE}" dist-win/AnimeUniverse-Windows-Setup.exe
          ls -lh dist-win/AnimeUniverse-Windows-Setup.exe

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeUniverse-Windows-exe
          path: dist-win/AnimeUniverse-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Windows .exe to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RELEASE_TAG="desktop-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Anime Universe Desktop Installers (.exe & .dmg) Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated Windows (.exe) and macOS (.dmg) desktop installers for Anime Universe."

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist-win/AnimeUniverse-Windows-Setup.exe --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist-win/AnimeUniverse-Windows-Setup.exe \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest=false
          fi

          DIRECT_EXE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/AnimeUniverse-Windows-Setup.exe"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "### DIRECT WINDOWS .EXE DOWNLOAD"
            echo "${DIRECT_EXE_URL}"
            echo ""
            echo "- **Release Page:** ${RELEASE_PAGE_URL}"
            echo "- **Filename:** \`AnimeUniverse-Windows-Setup.exe\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build-macos-dmg:
    name: Build macOS (.dmg)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build macOS .dmg Installer
        working-directory: desktop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle packageDmg --stacktrace --no-daemon

      - name: Stage macOS .dmg Installer
        shell: bash
        run: |
          set -e
          mkdir -p dist-mac
          DMG_FILE=$(find desktop/build/compose/binaries -name "*.dmg" | head -n 1)
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "ERROR: Could not find generated .dmg file"
            find desktop/build -maxdepth 5 || true
            exit 1
          fi
          cp "${DMG_FILE}" dist-mac/AnimeUniverse-macOS-Installer.dmg
          ls -lh dist-mac/AnimeUniverse-macOS-Installer.dmg

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeUniverse-macOS-dmg
          path: dist-mac/AnimeUniverse-macOS-Installer.dmg
          if-no-files-found: error

      - name: Publish macOS .dmg to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RELEASE_TAG="desktop-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Anime Universe Desktop Installers (.exe & .dmg) Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated Windows (.exe) and macOS (.dmg) desktop installers for Anime Universe."

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist-mac/AnimeUniverse-macOS-Installer.dmg --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist-mac/AnimeUniverse-macOS-Installer.dmg \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest=false
          fi

          DIRECT_DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/AnimeUniverse-macOS-Installer.dmg"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "### DIRECT MACOS .DMG DOWNLOAD"
            echo "${DIRECT_DMG_URL}"
            echo ""
            echo "- **Release Page:** ${RELEASE_PAGE_URL}"
            echo "- **Filename:** \`AnimeUniverse-macOS-Installer.dmg\`"
          } >> "${GITHUB_STEP_SUMMARY}"
