name: Build Debug APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Djava.awt.headless=true"

jobs:
  build-debug-apk:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Licenses & Platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$SDK_ROOT/licenses/android-sdk-preview-license"

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Setup Gradle with Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Compute Monotonic Version
        run: |
          RUN_NUM="${GITHUB_RUN_NUMBER:-0}"
          VERSION_CODE=$(( 2 + RUN_NUM ))
          VERSION_NAME="2.0.${RUN_NUM}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Computed Version: versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Create Environment Config
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Restore Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug \
              -PversionCode="${VERSION_CODE}" \
              -PversionName="${VERSION_NAME}" \
              --build-cache --parallel --stacktrace
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              -PversionCode="${VERSION_CODE}" \
              -PversionName="${VERSION_NAME}" \
              --build-cache --parallel --stacktrace
          else
            echo "ERROR: Neither gradle nor gradlew found on PATH"
            exit 1
          fi

      - name: Verify Debug APK Integrity
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Expected debug APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p dist
          ARTIFACT_FILENAME="AniTrAk-v${VERSION_NAME}-b${VERSION_CODE}-debug.apk"
          cp "$APK_SOURCE" "dist/${ARTIFACT_FILENAME}"
          cp "$APK_SOURCE" "dist/app-debug.apk"
          echo "ARTIFACT_FILENAME=${ARTIFACT_FILENAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=dist/${ARTIFACT_FILENAME}" >> "$GITHUB_ENV"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniTrAk-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}-debug
          path: dist/*
          compression-level: 0
          if-no-files-found: error

      - name: Publish Release on Tag or Push
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: ${{ format('AniTrAk Debug APK v2.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

