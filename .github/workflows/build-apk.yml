name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -e
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          if [ -z "${JAVA_VER_OUTPUT}" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+)(\.[0-9]+)*.*".*/\1/')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if ! echo "${JAVA_MAJOR}" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Failed to parse numeric Java major version from: ${JAVA_VER_OUTPUT}"
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "${SDK_ROOT}" ]; then
            mkdir -p "${SDK_ROOT}/licenses"
            printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-license"
            printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
            printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-arm-dbt-license"
          fi
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env
          elif [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          set -e
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${TARGET_APK}" ]; then
            echo "ERROR: Expected APK not found at ${TARGET_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "${TARGET_APK}" ]; then
            echo "ERROR: ${TARGET_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "${TARGET_APK}" ]; then
            echo "ERROR: ${TARGET_APK} is empty."
            exit 1
          fi
          case "${TARGET_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: ${TARGET_APK} does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "${TARGET_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path mismatch: ${TARGET_APK}"
            exit 1
          fi
          echo "Verified APK: ${TARGET_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -e
          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_ASSET_PATH}"
          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "ERROR: Failed to prepare release asset at ${RELEASE_ASSET_PATH}"
            exit 1
          fi
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK does not exist at ${ASSET_PATH}"
            exit 1
          fi
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK is empty at ${ASSET_PATH}"
            exit 1
          fi
          ASSET_FILENAME=$(basename "${ASSET_PATH}")
          case "${ASSET_FILENAME}" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared APK does not end in .apk: ${ASSET_FILENAME}"
              exit 1
              ;;
          esac
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk, got ${ASSET_FILENAME}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated debug APK built by GitHub Actions.

          - **Built by:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only (not a Play Store production release).
          - **Signing:** Signed only with a temporary debug keystore."

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "${RELEASE_TAG}"
            RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "WARNING: Publishing APK to GitHub Releases failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact named app-debug-apk remains available."
            fi
            {
              echo "### WARNING: GitHub Release Publishing Failed"
              echo "The APK build succeeded and the GitHub Actions artifact named \`app-debug-apk\` remains available for download."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
