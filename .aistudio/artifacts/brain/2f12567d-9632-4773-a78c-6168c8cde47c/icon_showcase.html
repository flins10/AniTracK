<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AniTrAk - App Launcher Icon</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #090B10;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #38BDF8;
      letter-spacing: 0.5px;
    }
    p.sub {
      margin: 0 0 32px 0;
      color: #94A3B8;
      font-size: 14px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      max-width: 800px;
    }
    .card {
      background: #111625;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .card h3 {
      margin: 16px 0 4px 0;
      font-size: 16px;
      color: #F8FAFC;
    }
    .card span {
      font-size: 12px;
      color: #64748B;
    }
    .icon-preview {
      width: 144px;
      height: 144px;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .icon-round-preview {
      width: 144px;
      height: 144px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.25);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .ref-preview {
      max-width: 144px;
      max-height: 144px;
      border-radius: 20px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <h1>AniTrAk App Launcher Icon</h1>

          <circle cx="54" cy="54" r="42" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.1" />
          <circle cx="54" cy="54" r="26" fill="#38BDF8" fill-opacity="0.08" />

          <circle cx="73" cy="36" r="1.2" fill="#FDE047" />

    <div class="card">
      <div class="icon-round-preview">
        <svg viewBox="0 0 108 108" width="100%" height="100%">
          <defs>

              <stop offset="50%" stop-color="#111625" />

          <polygon points="27,50 34,44 32,56" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
          <polygon points="81,50 74,44 76,56" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" />

          <polygon points="46,45 46,67 65,56" fill="#F43F5E" />
          <polygon points="48,49 48,63 60,56" fill="#FFFFFF" />
          <polygon points="50,53 50,59 55,56" fill="#BE123C" />

          <circle cx="35" cy="36" r="1.2" fill="#FDE047" />
          <circle cx="73" cy="36" r="1.2" fill="#FDE047" />
        </svg>
      </div>
      <h3>Round Launcher Icon</h3>
      <span>Circular Mask (ic_launcher_round)</span>
    </div>

    <div class="card">
      <img src="1792387533581.png" alt="Uploaded Reference Logo" class="ref-preview" />
      <h3>Uploaded Artwork Reference</h3>
      <span>User Provided Logo</span>
    </div>
  </div>
</body>
</html>
